name: Build Unsigned iOS

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          
      - name: Make scripts executable & Create Pre-build Directories
        run: |
          chmod +x gradlew
          chmod +x buildscripts/*.sh
          
          # Жестко создаем папки симулятора до старта любых скриптов, 
          # чтобы Luajit не падал на копировании инклюдов
          mkdir -p ios_build/ios-libs/SIMULATORARM64/include
          mkdir -p ios_build/ios-libs/SIMULATORARM64/lib
          
      - name: Build Gradle (iOS Arm64 Only)
        run: ./gradlew :composeApp:iosArm64MainBinaries --no-daemon
        
      - name: Build iOS C++ dependencies (Device Only)
        run: |
          export IOS_PLATFORM=OS64
          
          # Отключаем симулятор аккуратным обманом функций, чтобы не ломать логику C++
          sed -i '' 's/skip_if_installed "${name}_sim"/true/g' buildscripts/build_ios.sh
          sed -i '' 's/skip_if_installed "${name}_device"/skip_if_installed "${name}"/g' buildscripts/build_ios.sh
          
          ./buildscripts/build_ios.sh
        
      - name: Stage libs & Mock Simulator Directory
        run: |
          export IOS_PLATFORM=OS64
          
          # Клонируем папки для обмана финального скрипта копирования лаунчера
          cp -R ios_build/ios-libs/OS64/ ios_build/ios-libs/SIMULATORARM64/ 2>/dev/null || true
          
          ./buildscripts/stage_app_libs.sh device
        
      - name: Inject Custom Encoding and Config
        run: |
          mkdir -p iosApp/iosApp
          cat << 'EOF' > iosApp/iosApp/openmw.cfg
          fallback-archive=Morrowind.bsa
          fallback-archive=Tribunal.bsa
          fallback-archive=Bloodmoon.bsa
          encoding=win1251
          fallback=Movies_Company_Logo,skipped_on_ios.bik
          fallback=Movies_Morrowind_Logo,skipped_on_ios.bik
          EOF
          echo "Base configuration with win1251 successfully injected!"
        
      - name: Build xcodeApp
        run: |
          cd iosApp
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -derivedDataPath build_output
            
      - name: Package IPA
        run: |
          cd iosApp
          mkdir -p Payload
          cp -R build_output/Build/Products/Release-iphoneos/iosApp.app Payload/
          zip -r OpenMW_iOS_unsigned.ipa Payload
          mv OpenMW_iOS_unsigned.ipa ../..
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW_iOS_unsigned
          path: OpenMW_iOS_unsigned.ipa
