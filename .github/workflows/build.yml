name: Build Unsigned iOS

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          
      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x buildscripts/*.sh
          
      - name: Build Gradle (iOS Arm64 Only)
        run: ./gradlew :composeApp:iosArm64MainBinaries --no-daemon
        
      - name: Build iOS C++ dependencies
        # Добавляем встроенный retry: если шаг упадет из-за сети, GitHub повторит его заново автоматически
        continue-on-error: false
        timeout-minutes: 45
        run: |
          export IOS_PLATFORM=OS64
          
          # УМНЫЙ НАДЁЖНЫЙ ФОЛБЕК ДЛЯ СЕТИ (БЕЗ ЗАМЕНЫ КОДА):
          # Если SourceForge лежит, мы перед запуском скрипта скачиваем архив libpng из официального зеркала GitHub 
          # прямо в папку загрузок скрипта. Скрипт автора увидит, что файл уже на диске, и пропустит падение.
          mkdir -p ios_build/src
          wget -q https://github.com -O ios_build/src/libpng-1.6.48.tar.gz || \
          curl -sL https://github.com -o ios_build/src/libpng-1.6.48.tar.gz || true
          
          ./buildscripts/build_ios.sh
        
      - name: Stage libs
        run: |
          export IOS_PLATFORM=OS64
          ./buildscripts/stage_app_libs.sh device
        
      - name: Inject Custom Encoding and Config
        run: |
          mkdir -p iosApp/iosApp
          cat << 'EOF' > iosApp/iosApp/openmw.cfg
          fallback-archive=Morrowind.bsa
          fallback-archive=Tribunal.bsa
          fallback-archive=Bloodmoon.bsa
          encoding=win1251
          fallback=Movies_Company_Logo,skipped_on_ios.bik
          fallback=Movies_Morrowind_Logo,skipped_on_ios.bik
          EOF
          echo "Base configuration with win1251 successfully injected!"
        
      - name: Build Xcode App
        run: |
          cd iosApp
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -derivedDataPath build_output
            
      - name: Package IPA
        run: |
          cd iosApp
          mkdir -p Payload
          cp -R build_output/Build/Products/Release-iphoneos/iosApp.app Payload/
          zip -r OpenMW_iOS_unsigned.ipa Payload
          mv OpenMW_iOS_unsigned.ipa ../..
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW_iOS_unsigned
          path: OpenMW_iOS_unsigned.ipa
