name: Build Unsigned iOS

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x buildscripts/*.sh
          
      - name: Build Gradle (iOS Arm64 Only)
        run: ./gradlew :composeApp:iosArm64MainBinaries --no-daemon
        
      - name: Build iOS C++ dependencies (Device Only)
        run: |
          export IOS_PLATFORM=OS64
          
          # Полностью переписываем функции в скрипте автора, убирая любое упоминание симулятора
          # Заставляем build_configure_dual_platform собирать ТОЛЬКО OS64
          sed -i '' '/build_configure_dual_platform() {/,/^}/c\
          build_configure_dual_platform() { local name="$1"; local src_dir="$2"; shift 2; cd "$src_dir"; build_configure_platform_lib "$name" "OS64" "$src_dir" "$@"; mark_as_installed "${name}_device"; mark_as_installed "${name}_sim"; }\
          ' buildscripts/build_ios.sh

          # Заставляем build_dual_platform собирать ТОЛЬКО OS64
          sed -i '' '/build_dual_platform() {/,/^}/c\
          build_dual_platform() { local name="$1"; local src_dir="$2"; shift 2; cd "$src_dir"; local device_args=(); for arg in "$@"; do device_args+=("${arg//\\\${PLATFORM_PREFIX\}/${PREFIX}\/OS64}"); done; build_platform_lib "$name" "OS64" "$src_dir" "${device_args[@]}"; mark_as_installed "${name}_device"; mark_as_installed "${name}_sim"; }\
          ' buildscripts/build_ios.sh
          
          # Запускаем сборку — теперь она физически не умеет заходить в симуляторные шаги
          ./buildscripts/build_ios.sh
        
      - name: Stage libs & Mock Simulator Directory
        run: |
          export IOS_PLATFORM=OS64
          
          # Перед запуском копирования создаем полный клон папки OS64 под именем SIMULATORARM64.
          # Скрипт копирования stage_app_libs.sh подумает, что симулятор собран, скопирует файлы,
          # но Xcode при сборке под iphoneos использует только файлы из девайс-папки.
          mkdir -p ios_build/ios-libs/SIMULATORARM64
          cp -R ios_build/ios-libs/OS64/ ios_build/ios-libs/SIMULATORARM64/ 2>/dev/null || true
          
          ./buildscripts/stage_app_libs.sh device
        
      - name: Inject Custom Encoding and Config
        run: |
          mkdir -p iosApp/iosApp
          cat << 'EOF' > iosApp/iosApp/openmw.cfg
          fallback-archive=Morrowind.bsa
          fallback-archive=Tribunal.bsa
          fallback-archive=Bloodmoon.bsa
          encoding=win1251
          fallback=Movies_Company_Logo,skipped_on_ios.bik
          fallback=Movies_Morrowind_Logo,skipped_on_ios.bik
          EOF
          echo "Base configuration with win1251 successfully injected!"
        
      - name: Build xcodeApp
        run: |
          cd iosApp
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -derivedDataPath build_output
            
      - name: Package IPA
        run: |
          cd iosApp
          mkdir -p Payload
          cp -R build_output/Build/Products/Release-iphoneos/iosApp.app Payload/
          zip -r OpenMW_iOS_unsigned.ipa Payload
          mv OpenMW_iOS_unsigned.ipa ../..
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW_iOS_unsigned
          path: OpenMW_iOS_unsigned.ipa
