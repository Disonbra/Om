name: Build Unsigned OpenMW iOS

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: openmw-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  IPHONEOS_DEPLOYMENT_TARGET: "26.2"
  DEPLOYMENT_TARGET: "26.2"
  IOS_PLATFORM: "OS64"

jobs:
  build:
    name: Build OpenMW iOS IPA
    runs-on: macos-26

    steps:
      # =========================================================
      # Checkout
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      # =========================================================
      # Xcode
      # =========================================================

      - name: Select Xcode 26.2
        shell: bash
        run: |
          set -Eeuo pipefail

          XCODE_PATH=""

          for candidate in \
            "/Applications/Xcode_26.2.app" \
            "/Applications/Xcode_26.2.0.app" \
            "/Applications/Xcode_26.2.1.app" \
            "/Applications/Xcode.app"
          do
            if [[ -d "${candidate}" ]]; then
              XCODE_PATH="${candidate}"
              break
            fi
          done

          if [[ -z "${XCODE_PATH}" ]]; then
            echo "ERROR: Xcode was not found"

            echo "Installed Xcode versions:"
            find /Applications \
              -maxdepth 1 \
              -type d \
              -name "Xcode*.app" \
              -print | sort

            exit 1
          fi

          echo "Using Xcode:"
          echo "${XCODE_PATH}"

          sudo xcode-select -s "${XCODE_PATH}/Contents/Developer"
          sudo xcodebuild -license accept || true
          sudo xcodebuild -runFirstLaunch || true

          echo
          xcode-select -p

          echo
          xcodebuild -version

          echo
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

          echo
          echo "macOS host SDK:"
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --show-sdk-version

      # =========================================================
      # Prepare repository
      # =========================================================

      - name: Prepare repository
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x ./gradlew
          chmod +x ./buildscripts/*.sh

          required_files=(
            "./gradlew"
            "./buildscripts/build_ios.sh"
            "./buildscripts/stage_app_libs.sh"
            "./buildscripts/patch_shaders.sh"
            "./buildscripts/package_ipa.sh"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "${file}" ]]; then
              echo "ERROR: required file not found:"
              echo "${file}"
              exit 1
            fi

            echo "Found: ${file}"
          done

          bash -n ./buildscripts/build_ios.sh
          bash -n ./buildscripts/stage_app_libs.sh
          bash -n ./buildscripts/patch_shaders.sh
          bash -n ./buildscripts/package_ipa.sh

          XCODE_PROJECT="$(
            find ./iosApp \
              -type d \
              -name "*.xcodeproj" \
              -print -quit
          )"

          if [[ -z "${XCODE_PROJECT}" ]]; then
            echo "ERROR: Xcode project was not found"
            find ./iosApp -maxdepth 6 -print || true
            exit 1
          fi

          echo "Xcode project:"
          echo "${XCODE_PROJECT}"

      # =========================================================
      # Cache
      # =========================================================

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
            ~/Library/Caches
            ios_build/src
            ios_build/ios-cmake
            ios_build/ios-libs
          key: openmw-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('buildscripts/build_ios.sh', 'buildscripts/package_ipa.sh', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            openmw-ios-${{ runner.os }}-${{ runner.arch }}-
            openmw-ios-

      # =========================================================
      # Kotlin Multiplatform iOS
      # =========================================================

      - name: Build Kotlin iOS Arm64 binaries
        shell: bash
        run: |
          set -Eeuo pipefail

          unset ANDROID_PREFS_ROOT || true
          unset ANDROID_USER_HOME || true
          unset ANDROID_SDK_HOME || true
          unset ANDROID_HOME || true

          ./gradlew \
            :composeApp:iosArm64MainBinaries \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      # =========================================================
      # OpenMW native build
      # =========================================================

      - name: Build OpenMW native libraries
        shell: bash
        env:
          IOS_PLATFORM: OS64
          DEPLOYMENT_TARGET: "26.2"
          IPHONEOS_DEPLOYMENT_TARGET: "26.2"
        run: |
          set -Eeuo pipefail

          # Do not pass iOS compiler flags into the host ICU build.
          unset SDKROOT || true
          unset SDK_NAME || true
          unset PLATFORM_NAME || true
          unset PLATFORM || true
          unset EFFECTIVE_PLATFORM_NAME || true
          unset CMAKE_OSX_SYSROOT || true
          unset CMAKE_OSX_ARCHITECTURES || true
          unset CC || true
          unset CXX || true
          unset AR || true
          unset RANLIB || true
          unset STRIP || true
          unset CFLAGS || true
          unset CPPFLAGS || true
          unset CXXFLAGS || true
          unset LDFLAGS || true
          unset CONFIG_SITE || true
          unset MACOSX_DEPLOYMENT_TARGET || true

          bash ./buildscripts/build_ios.sh

      - name: Upload native libraries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW_iOS_native_libraries
          path: |
            ios_build/ios-libs/OS64
            ios_build/ios-libs/SIMULATORARM64
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload OpenMW native build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW_iOS_engine_build
          path: |
            ios_build/src/openmw-*/build_openmw_*
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
          
      - name: Inspect native outputs
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Frameworks:"
          find ios_build \
            -type d \
            -name "*.framework" \
            -print | sort || true

          echo
          echo "Static libraries:"
          find ios_build \
            -type f \
            -name "*.a" \
            -print | sort | head -300 || true

          echo
          echo "Dynamic libraries:"
          find ios_build \
            -type f \
            -name "*.dylib" \
            -print | sort | head -300 || true

      # =========================================================
      # Configuration
      # =========================================================

      - name: Create win1251 configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p ./iosApp/iosApp

          cat > ./iosApp/iosApp/openmw.cfg <<'EOF'
          fallback-archive=Morrowind.bsa
          fallback-archive=Tribunal.bsa
          fallback-archive=Bloodmoon.bsa
          encoding=win1251
          fallback=Movies_Company_Logo,skipped_on_ios.bik
          fallback=Movies_Morrowind_Logo,skipped_on_ios.bik
          EOF

          echo "Source configuration:"
          cat ./iosApp/iosApp/openmw.cfg

      # =========================================================
      # Device staging
      # =========================================================

      - name: Stage device libraries and resources
        shell: bash
        env:
          IOS_PLATFORM: OS64
          DEPLOYMENT_TARGET: "26.2"
          IPHONEOS_DEPLOYMENT_TARGET: "26.2"
        run: |
          set -Eeuo pipefail

          bash ./buildscripts/stage_app_libs.sh device

      - name: Show staged configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          CONFIG_PATH="${GITHUB_WORKSPACE}/iosApp/OpenMWAssets/openmw.cfg"

          echo "=== Staged openmw.cfg diagnostic ==="

          if [[ -f "${CONFIG_PATH}" ]]; then
            cat "${CONFIG_PATH}"
            echo
            grep -i "encoding" "${CONFIG_PATH}" || true
          else
            echo "INFO: staged openmw.cfg was not found."
            echo "Build will continue."
          fi

      # =========================================================
      # Shader patching
      # =========================================================

      - name: Locate and patch shaders
        shell: bash
        run: |
          set -Eeuo pipefail

          SHADERS_DIR="$(
            find "${GITHUB_WORKSPACE}/iosApp/OpenMWAssets" \
              -type d \
              -path "*/resources/shaders" \
              -print -quit || true
          )"

          if [[ -z "${SHADERS_DIR}" ]]; then
            echo "ERROR: shaders were not found after staging"

            find "${GITHUB_WORKSPACE}/iosApp/OpenMWAssets" \
              -maxdepth 8 \
              -print | sort || true

            exit 1
          fi

          echo "Shaders directory:"
          echo "${SHADERS_DIR}"

          bash ./buildscripts/patch_shaders.sh "${SHADERS_DIR}"

      # =========================================================
      # Build and package
      # =========================================================

      - name: Build and package device IPA
        shell: bash
        env:
          IOS_PLATFORM: OS64
          DEPLOYMENT_TARGET: "26.2"
          IPHONEOS_DEPLOYMENT_TARGET: "26.2"
        run: |
          set -Eeuo pipefail

          bash ./buildscripts/package_ipa.sh device

      # =========================================================
      # Find any IPA name
      # =========================================================

      - name: Find and normalize IPA
        shell: bash
        run: |
          set -Eeuo pipefail

          FINAL_IPA="${GITHUB_WORKSPACE}/OpenMW_iOS_unsigned.ipa"

          mapfile -t IPA_FILES < <(
            find "${GITHUB_WORKSPACE}" \
              -type f \
              -name "*.ipa" \
              ! -path "${FINAL_IPA}" \
              -print
          )

          if [[ "${#IPA_FILES[@]}" -eq 0 ]]; then
            echo "ERROR: no IPA file was created"

            find "${GITHUB_WORKSPACE}" \
              -maxdepth 5 \
              -type f \
              -print | sort | head -500

            exit 1
          fi

          if [[ "${#IPA_FILES[@]}" -eq 1 ]]; then
            SOURCE_IPA="${IPA_FILES[0]}"
          else
            echo "Multiple IPA files found:"
            printf '%s\n' "${IPA_FILES[@]}"

            SOURCE_IPA="$(
              printf '%s\n' "${IPA_FILES[@]}" |
              xargs -I{} stat -f '%m %N' "{}" |
              sort -n |
              tail -1 |
              cut -d' ' -f2-
            )"
          fi

          echo "Selected IPA:"
          echo "${SOURCE_IPA}"

          rm -f "${FINAL_IPA}"
          cp -f "${SOURCE_IPA}" "${FINAL_IPA}"

          ls -lh "${FINAL_IPA}"

      # =========================================================
      # Diagnostic only
      # =========================================================

      - name: Verify IPA and print openmw.cfg diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail

          IPA="${GITHUB_WORKSPACE}/OpenMW_iOS_unsigned.ipa"
          CHECK_DIR="${RUNNER_TEMP}/openmw-ipa-check"

          if [[ ! -f "${IPA}" ]]; then
            echo "ERROR: normalized IPA was not found:"
            echo "${IPA}"
            exit 1
          fi

          rm -rf "${CHECK_DIR}"
          mkdir -p "${CHECK_DIR}"

          unzip -q "${IPA}" -d "${CHECK_DIR}"

          APP_PATH="$(
            find "${CHECK_DIR}/Payload" \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              -print -quit || true
          )"

          if [[ -z "${APP_PATH}" ]]; then
            echo "ERROR: Payload/*.app was not found"
            unzip -l "${IPA}"
            exit 1
          fi

          echo "Application bundle:"
          echo "${APP_PATH}"

          echo
          echo "=== openmw.cfg diagnostic ==="

          CFG_PATH="$(
            find "${APP_PATH}" \
              -type f \
              -name "openmw.cfg" \
              -print -quit || true
          )"

          if [[ -z "${CFG_PATH}" ]]; then
            echo "INFO: openmw.cfg was not found inside the app."
            echo "This is diagnostic only; build continues."
          else
            echo "Configuration path:"
            echo "${CFG_PATH}"

            echo
            echo "Configuration contents:"
            cat "${CFG_PATH}"

            echo
            echo "Encoding lines:"
            grep -i "encoding" "${CFG_PATH}" || true
          fi

          echo
          echo "=== IPA contents ==="
          unzip -l "${IPA}"

      # =========================================================
      # Artifacts
      # =========================================================

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW_iOS_unsigned
          path: OpenMW_iOS_unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenMW_iOS_build_logs
          path: |
            ios_build/**/*.log
            ios_build/**/*.txt
            ios_build/**/CMakeCache.txt
            ios_build/**/config.log
          if-no-files-found: ignore
          retention-days: 90
